<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Registration Form</title>  
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg #667eea,red);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20%;
        }
       h1{
        text-align: center;
        color: #543cc4;
        margin-bottom: 25px;
    }
    .subtitle{
        text-align: center;
        color: gray;
        margin-bottom: 25px;
    }
    .container{
        background-color: rgb(191, 218, 243);
        width:420px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 50px 20px rgba(0,0,0.2);
    }

    </style>
</head>  
<body>  
    <div class="container">
    <h1>Registration Form </h1>  
    <p class="subtitle">Fill in your Details to register</p>
    <form>  
        <label>Full Name:</label>  
        <input type="text" placeholder="Enter your name" required><br>  
        <br>  
        <label>Email:</label>  
        <input type="email" placeholder="Enter your email"required><br>  
        <br>  
        <label>Age:</label>  
        <input type="number" placeholder="Enter your age"required>  
        <br><br>  

        <div class="gender"><label>Gender:</label>  
        <input type="checkbox " >Male  
        <input type="radio">Female  
        <br>  
        <br>  
        </div>
        <label>Course:</label>  
        <select>  
            <option> </option>  
            <option>BCA</option>  
            <option>BSc</option>  
            <option>B.E</option>  
        </select>  
        <br>  
        <br>  
        <button type="Submit">Register</button>  
        </div>
    </form>  
</body>  
</html>
